# ============================================
# Enterprise Status Platform — Spring Boot Configuration
# ============================================

server.port=${SERVER_PORT:8082}

# Database Configuration (MySQL 8+)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:vnu_status}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:vnu_status}
spring.datasource.password=${DB_PASSWORD:vnu_status}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — validate only, schema migration via db/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Telegram Alert Settings (Set via environment variables)
telegram.bot-token=${TELEGRAM_BOT_TOKEN:YOUR_TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID:YOUR_TELEGRAM_CHAT_ID}

# Health Check Intervals & Thread Pool
check.internal-interval-ms=30000
check.external-interval-ms=300000
check.thread-pool-size=10
check.default-timeout-seconds=15

# Logging Levels
logging.level.vn.edu.vnu.status=INFO
logging.level.org.springframework.web=WARN
